name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New release version (with or without the leading v)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Releases must be triggered from main."
            exit 1
          fi

  tests-and-lint:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Run Ruff
        run: ruff check --isolated --select E4,E7,E9,F custom_components/nsclock tests
      - name: Run tests
        run: pytest -vv

  hassfest:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate with Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: integration

  publish:
    needs:
      - tests-and-lint
      - hassfest
      - hacs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release version
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Releases must be triggered from main."
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_VERSION#v}"

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must be a semantic version such as 1.2.3 or 1.2.3-beta.1."
            exit 1
          fi

          manifest_version="$(jq -er '.version | select(type == "string" and length > 0)' custom_components/nsclock/manifest.json)"
          if [[ "$RELEASE_VERSION" == "$manifest_version" ]]; then
            echo "::error::Version $RELEASE_VERSION is already set in manifest.json. Choose the next release version."
            exit 1
          fi

          current_main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$current_main_sha" != "$SHA" ]]; then
            echo "::error::main has advanced since this workflow was started. Start a new release run."
            exit 1
          fi

          tag="v$RELEASE_VERSION"
          existing_tag="$(git ls-remote --tags --refs origin "refs/tags/$tag")"
          if [[ -n "$existing_tag" ]]; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update version, changelog, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/release-notes.md"
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f "tag_name=$TAG" \
            -f "target_commitish=$SHA" \
            --jq .body > "$notes_file"

          if [[ ! -s "$notes_file" ]]; then
            echo "::error::GitHub generated empty release notes."
            exit 1
          fi

          jq --arg version "$RELEASE_VERSION" '.version = $version' \
            custom_components/nsclock/manifest.json > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" custom_components/nsclock/manifest.json

          changelog_file="$RUNNER_TEMP/CHANGELOG.md"
          {
            printf '# Changelog\n\n'
            printf '## [%s] - %s\n\n' "$RELEASE_VERSION" "$(date -u +%Y-%m-%d)"
            cat "$notes_file"
            printf '\n'
            if [[ -f CHANGELOG.md ]]; then
              sed '1{/^# Changelog$/d;}' CHANGELOG.md | sed '/./,$!d'
            fi
          } > "$changelog_file"
          mv "$changelog_file" CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/nsclock/manifest.json CHANGELOG.md
          git commit -m "chore(release): $TAG"

          release_sha="$(git rev-parse HEAD)"
          git tag -a "$TAG" "$release_sha" -m "$TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"

          if [[ "$RELEASE_VERSION" == *-* ]]; then
            gh release create "$TAG" \
              --target "$release_sha" \
              --title "$TAG" \
              --notes-file "$notes_file" \
              --verify-tag \
              --prerelease
          else
            gh release create "$TAG" \
              --target "$release_sha" \
              --title "$TAG" \
              --notes-file "$notes_file" \
              --verify-tag
          fi
